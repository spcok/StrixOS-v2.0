<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>StrixOS</title>

    <!-- PWA Web App Manifest & App Icons -->
    <link rel="manifest" href="/manifest.json?v=5" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/logo192.png?v=3" />
    <link rel="apple-touch-icon" href="/logo192.png?v=3" />

    <!-- iOS / Safari Standalone Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StrixOS" />

    <!-- Android / Chrome Standalone Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Instant Bootloader Inline Styles -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior-y: none;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .boot-logo-container {
        width: 120px;
        height: 120px;
        background: #1e293b;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 28px;
        box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .boot-logo {
        width: 78px;
        height: 78px;
        object-fit: contain;
        border-radius: 50%;
      }

      .boot-title {
        margin-top: 24px;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #ffffff;
      }

      .boot-subtitle {
        margin-top: 4px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #10b981;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.97);
          opacity: 0.88;
        }
      }
    </style>
  </head>
  <body class="select-none overscroll-none bg-slate-950">
    <div id="root">
      <!-- Instant Pre-React Boot Screen -->
      <div id="boot-splash">
        <div class="boot-logo-container">
          <img src="/logo192.png?v=3" alt="StrixOS Logo" class="boot-logo" />
        </div>
        <div class="boot-title">StrixOS 2.0</div>
        <div class="boot-subtitle">Avian Management</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
